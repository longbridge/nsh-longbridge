[package]
name = "nsh-longbridge"
description = "A component library for NSH apps: a neutral, token-customizable look on nsh/base's behavior, for TSX and Rust apps."
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
publish = false

[lib]
path = "src/lib.rs"

# nsh's crates are a caret requirement on the release line (`0.7`: any
# 0.7.x), not a pin. This crate is installed into apps as an nshm, and the
# workspace the `nsh` CLI generates for an app requires nsh's crates from
# crates.io at exactly the CLI's version: with `0.7`, Cargo resolves one
# `nsh-core` for the app and this crate, whichever 0.7.x CLI the app uses.
# An exact version here fails as soon as the CLI moves (`=0.7.0` against a
# 0.7.1 CLI): Cargo cannot select two 0.7.x of one crate, so the app does
# not build. A Git dependency is no way out: the generated workspace does
# not patch nshm's Git dependencies to crates.io, so the app would link two
# `nsh-core`s. `Cargo.lock` keeps the version of the CLI this repository is
# developed with. Raise the minimum when this crate needs a newer 0.7.x;
# move to the next line (`0.8`) together with the CLI.
[dependencies]
nsh-core = { version = "0.7" }
nsh-base = { version = "0.7" }
log = "0.4"
serde_json = "1"

[dev-dependencies]
nsh-core = { version = "0.7", features = ["declarations"] }
nsh-engine = { version = "0.7", default-features = false }
nsh-testing = { version = "0.7", default-features = false, features = ["bundle"] }

[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"
unreachable_pub = "warn"

[lints.clippy]
dbg_macro = "warn"
