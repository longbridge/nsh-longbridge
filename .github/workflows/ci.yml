# Checks the library on every pull request and on main: formatting, Clippy and
# the headless tests (behavior, geometry, the token tables in the docs and
# `themes/default.json`, no color literal in the components).
name: CI

on:
  pull_request:
    paths:
      - "src/**"
      - "tests/**"
      - "themes/**"
      - "docs/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/ci.yml"
  push:
    branches: [main]
    paths:
      - "src/**"
      - "tests/**"
      - "themes/**"
      - "docs/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/ci.yml"
  workflow_dispatch:

permissions:
  contents: read

# A newer push to a pull request replaces its run; main runs every push.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  # The self-hosted runners are shared: the toolchain below is installed
  # without becoming the machine's default, and this picks it.
  RUSTUP_TOOLCHAIN: stable

jobs:
  check:
    # The organization's `public` runners, as the Pages workflow and nsh's
    # own use them.
    runs-on: [public, Linux, X64]
    steps:
      - uses: actions/checkout@v4

      # QuickJS (in nsh's engine, which the tests run) is C; bindgen needs
      # libclang.
      - name: Install clang
        run: sudo apt-get update && sudo apt-get install -y clang libclang-dev

      - name: Setup Rust
        run: |
          bin="${CARGO_HOME:-$HOME/.cargo}/bin"
          export PATH="$bin:$PATH"
          command -v rustup || curl -fsSL https://sh.rustup.rs | sh -s -- -y --no-modify-path --default-toolchain none
          rustup toolchain install stable --profile minimal -c clippy -c rustfmt
          echo "$bin" >> "$GITHUB_PATH"

      - uses: Swatinem/rust-cache@v2

      - name: Format
        run: cargo fmt --check

      - name: Clippy
        run: cargo clippy --all-targets --locked -- -D warnings

      - name: Test
        run: cargo test --locked
