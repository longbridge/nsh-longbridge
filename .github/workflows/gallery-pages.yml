# Builds the website (the Astro home page around the gallery's live demos, and
# the gallery's web build for every component page) and publishes it on GitHub
# Pages from main. Pull requests don't build it: the merge would build the same
# site again right after.
name: Gallery Pages

on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "themes/**"
      - "gallery/**"
      - "website/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/gallery-pages.yml"
  workflow_dispatch:

permissions:
  contents: read

# A newer push to main replaces a run that hasn't finished: only the latest
# site is worth deploying.
concurrency:
  group: gallery-pages
  cancel-in-progress: true

env:
  NSH_VERSION: v0.7.2

jobs:
  build:
    # The organization's `public` runners, as nsh's workflows use them.
    runs-on: [public, Linux, X64]
    steps:
      - uses: actions/checkout@v4

      # The web runtime's C code: clang compiles it for wasm32, llvm-ar archives it.
      - name: Install clang and LLVM
        run: sudo apt-get update && sudo apt-get install -y clang llvm libclang-dev

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: gallery -> target

      - name: Install nsh
        run: |
          curl -fsSL https://nsh.dev/install.sh | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.3

      - name: Install the website's packages
        working-directory: website
        run: bun install --frozen-lockfile

      # `build-site.sh` builds the gallery for the web (every component page at
      # `<id>.html` with `<base href>`, `404.html` and the home page's demos at
      # `embed/<name>.html`) and puts the Astro home page in front of it.
      - name: Build the site
        env:
          AR_wasm32_unknown_unknown: llvm-ar
          SITE_BASE: /${{ github.event.repository.name }}/
          PUBLIC_SITE_URL: https://${{ github.repository_owner }}.github.io
        run: sh website/scripts/build-site.sh "$RUNNER_TEMP/site"

      - uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ runner.temp }}/site

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: [public, Linux, X64]
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
